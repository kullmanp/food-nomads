quarkus.default-locale=en
quarkus.locales=en

quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true

# The image name comes from app.image in the parent pom.
quarkus.container-image.build=true

quarkus.hibernate-orm.schema-management.strategy=validate

quarkus.webauthn.relying-party.name=Food Nomads
quarkus.webauthn.login-page=/login

# Everything needs a logged-in Member, except the home page, joining and logging in.
# Pages redirect to /login, /api answers 401 (see ApiAuthenticationChallenge).
quarkus.http.auth.permission.members.paths=/*
quarkus.http.auth.permission.members.policy=authenticated
quarkus.http.auth.permission.public.paths=/,/join/*,/login,/api/status,/api/join/*,/api/login,/api/login/*,/q/*
quarkus.http.auth.permission.public.policy=permit

# Where Members reach the app. Used for the links the app hands out, such as the Bootstrap Invite.
foodnomads.base-url=http://localhost:8080
