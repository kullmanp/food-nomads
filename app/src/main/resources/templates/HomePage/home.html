{#include layout}
{#title}{msg:app_name}{/title}
<main id="home">
    <header class="brand">
        <h1>{msg:app_name}</h1>
        {#if currentMember}
        <form id="log-out-form" method="post" action="/logout">
            <button id="log-out-button" class="text-button" type="submit">{msg:home_log_out}</button>
        </form>
        {/if}
    </header>
    <p class="poster">{msg:home_placeholder}</p>
    {#if currentMember}
    <p>{msg:home_logged_in_as}: <span id="current-member">{currentMember}</span></p>
    {#else}
    <a id="log-in-link" class="solid" href="/login">{msg:home_log_in}</a>
    {/if}
</main>
{#if currentMember}
{#tabs current="home" /}
{/if}
{/include}
