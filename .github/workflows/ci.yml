name: CI

on:
  push:
  workflow_dispatch:

env:
  MAVEN_ARGS: -B --no-transfer-progress

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Build, unit tests and image
        run: ./mvnw verify -pl app

      - name: Image name
        id: image
        run: echo "image=$(./mvnw -q -N help:evaluate -Dexpression=app.image -DforceStdout)" >> "$GITHUB_OUTPUT"

      - name: Save image
        run: docker save "${{ steps.image.outputs.image }}" | gzip > app-image.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: app-image
          path: app-image.tar.gz
          retention-days: 1

  acceptance:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        driver: [api, ui]
    name: acceptance (${{ matrix.driver }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - uses: actions/download-artifact@v5
        with:
          name: app-image

      - name: Load image
        run: gunzip -c app-image.tar.gz | docker load

      - name: Install Chromium
        if: matrix.driver == 'ui'
        run: >
          ./mvnw test-compile exec:java -pl acceptance-tests
          -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.classpathScope=test
          -Dexec.args="install --with-deps chromium"

      - name: Acceptance tests
        run: ./mvnw verify -pl acceptance-tests -Ddriver=${{ matrix.driver }}

  publish:
    needs: [build, acceptance]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: app-image

      - name: Load image
        run: gunzip -c app-image.tar.gz | docker load

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          repo="${IMAGE%:*}"
          for tag in latest "${GITHUB_SHA}"; do
            docker tag "$IMAGE" "$repo:$tag"
            docker push "$repo:$tag"
          done
